{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 36px 32px; border-radius: 20px;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-badge" style="display: inline-block; font-size: 1.6rem; padding: 10px 18px; margin-bottom: 14px;">MK</div>
      <h2 style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px;">Franchise Scorecard</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Sign in to access your operations dashboard</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px;">Email Address</label>
        <div style="position: relative;">
          <input 
            type="email" 
            name="email" 
            id="login-email"
            value="{{ email or '' }}" 
            required 
            placeholder="name@mobileklinik.ca" 
            class="select-control" 
            style="width: 100%; padding-left: 38px;"
          >
          <i data-feather="mail" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-dim);"></i>
        </div>
      </div>

      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px;">Password</label>
        <div style="position: relative;">
          <input 
            type="password" 
            name="password" 
            id="login-password"
            required 
            placeholder="••••••••••••" 
            class="select-control" 
            style="width: 100%; padding-left: 38px;"
          >
          <i data-feather="lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-dim);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 0.95rem;">
        Sign In to Scorecard <i data-feather="arrow-right"></i>
      </button>
    </form>

    <!-- Quick Role Switcher for Testing -->
    <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-glass); text-align: center;">
      <span style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); display: block; margin-bottom: 10px;">Quick Test Profiles:</span>
      <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="btn btn-secondary" style="font-size: 0.75rem; padding: 4px 10px;" onclick="fillLogin('admin@mobileklinik.ca', 'AdminPassword2026!')">
          👑 Super Admin
        </button>
        <button type="button" class="btn btn-secondary" style="font-size: 0.75rem; padding: 4px 10px;" onclick="fillLogin('franchise.west@mobileklinik.ca', 'OwnerPassword2026!')">
          🏢 Franchise Owner (8 Stores)
        </button>
        <button type="button" class="btn btn-secondary" style="font-size: 0.75rem; padding: 4px 10px;" onclick="fillLogin('manager.countryhills@mobileklinik.ca', 'ManagerPassword2026!')">
          🏬 Store Manager (1 Store)
        </button>
      </div>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function fillLogin(email, pass) {
    document.getElementById('login-email').value = email;
    document.getElementById('login-password').value = pass;
  }
</script>
{% endblock %}
